name: ESLint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '21 11 * * 0' # So 11:21 UTC

# Optional: parallele Runs pro PR vermeiden
concurrency:
  group: eslint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: Run ESLint scanning
    runs-on: ubuntu-latest
    # Minimal nötige Rechte
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
          # Optional: falls du .nvmrc/.node-version hast:
          # node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci --omit=optional --no-audit --no-fund

      # 1) Lauf für PR-Annotations (Formatter: stylish im Log)
      - name: Run ESLint (for PR annotations)
        id: eslint_annot
        run: npx eslint . --format stylish
        continue-on-error: true

      # 2) Lauf für SARIF (Security → Code scanning alerts)
      - name: Install SARIF formatter
        run: npm install --no-save -D @microsoft/eslint-formatter-sarif@latest

      - name: Run ESLint (SARIF)
        env:
          # Unterdrückte Regeln nicht exportieren; hält den Noise niedrig
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: >
          npx eslint . --format @microsoft/eslint-formatter-sarif
          --output-file eslint-results.sarif
        continue-on-error: true

      # Code Scanning Upload nur, wenn es eine Datei gibt
      - name: Upload ESLint results to Security tab
        if: ${{ always() && hashFiles('eslint-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif

      # Optionales Artefakt (praktisch zum lokalen Öffnen)
      - name: Upload SARIF artifact (optional)
        if: ${{ always() && hashFiles('eslint-results.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: eslint-results
          path: eslint-results.sarif
