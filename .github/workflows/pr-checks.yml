name: PR Checks

permissions:
  contents: read
  actions: read

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test --if-present

      - name: Generate dashboard (sanity)
        run: npm run generate:dashboard

      - name: List generated status files
        run: |
          ls -la docs/status || true
          ls -la docs/status/images || true
