name: CI - Jest Tests

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Diagnostics
        run: |
          node -v
          npm -v
          pwd || cd
          ls -la

      - name: Install dependencies
        run: npm ci

      - name: Run Jest via script (with junit)
        env:
          CI: true
          NODE_OPTIONS: --experimental-vm-modules
          JEST_JUNIT_OUTPUT: junit.xml
        run: node scripts/run-tests.js --ci --reporters=default --reporters=jest-junit

      - name: Upload coverage (if present)
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-${{ matrix.os }}-node${{ matrix.node }}
          path: coverage/lcov.info

      - name: Upload junit (if present)
        if: always() && hashFiles('junit.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-node${{ matrix.node }}
          path: junit.xml

      - name: Upload jest output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jest-logs-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            ./**/jest-*.log
          if-no-files-found: ignore
