 name: ESLint
 on:
   push:
     branches: [ "main" ]
   pull_request:
     branches: [ "main" ]
   schedule:
     - cron: '21 11 * * 0'

 jobs:
   eslint:
     name: Run eslint scanning
     runs-on: ubuntu-latest
     permissions:
       contents: read
       security-events: write
       actions: read
     steps:
+      # 0) Empfohlener Node‑Cache
+      - uses: actions/setup-node@v4
+        with:
+          node-version: 20
+          cache: 'npm'

       - name: Checkout code
         uses: actions/checkout@v4

-      - name: Install ESLint           # ❌ alte, feste Version
-        run: |
-          npm install eslint@8.10.0
-          npm install @microsoft/eslint-formatter-sarif@3.1.0
+      - name: Install deps              # ✅ nimmt Versionen aus package.json +
+        run: npm ci --omit=optional     #   garantiert reproduzierbar

+      # optional: falls du den SARIF‑Formatter nicht schon als Dep hast
+      - run: npm i -D @microsoft/eslint-formatter-sarif@latest

-      - name: Run ESLint
-        env:
-          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
-        run: npx eslint .
-          --config .eslintrc.js
-          --ext .js,.jsx,.ts,.tsx
-          --format @microsoft/eslint-formatter-sarif
-          --output-file eslint-results.sarif
+      - name: Run ESLint
+        env:
+          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
+        run: >
+          npx eslint . --config .eslintrc.js
+          --ext .js,.jsx,.ts,.tsx
+          --format @microsoft/eslint-formatter-sarif
+          --output-file eslint-results.sarif
         continue-on-error: true
